name: Seed Demo Data (DEV)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Seed demo data on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/municipall/dev
            READY=0
            for i in $(seq 1 30); do
              CID=$(docker compose -f docker-compose.dev.yml ps -q backend-dev 2>/dev/null || true)
              if [ -n "$CID" ]; then
                STATUS=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || echo "unknown")
              else
                STATUS="missing"
              fi
              if [ "$STATUS" = "running" ]; then
                if docker compose -f docker-compose.dev.yml exec -T backend-dev node -e "process.exit(0)" 2>/dev/null; then
                  READY=1
                  break
                fi
              fi
              echo "  tentative $i/30 — état: $STATUS"
              sleep 5
            done
            if [ "$READY" != "1" ]; then
              docker compose -f docker-compose.dev.yml logs --tail=80 backend-dev || true
              exit 1
            fi
            docker compose -f docker-compose.dev.yml exec -T postgres-dev psql -U ${{ secrets.DATABASE_USER_DEV }} -d ${{ secrets.DATABASE_NAME_DEV }} -v ON_ERROR_STOP=0 -c "ALTER TABLE invitations ADD COLUMN IF NOT EXISTS created_at timestamptz NOT NULL DEFAULT now(); ALTER TABLE invitations ADD COLUMN IF NOT EXISTS expires_at timestamptz; ALTER TABLE invitations ADD COLUMN IF NOT EXISTS role varchar(64) DEFAULT 'assistant' NOT NULL; ALTER TABLE invitations ADD COLUMN IF NOT EXISTS name varchar; ALTER TABLE invitations ADD COLUMN IF NOT EXISTS invited_by_id integer;"
            docker compose -f docker-compose.dev.yml exec -T backend-dev sh -c "npm install --no-save ts-node tsconfig-paths typescript && npm run seed:demo"
