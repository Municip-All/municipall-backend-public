name: Ops — pgvector + IA schema (VPS prod)

on:
  workflow_dispatch:

jobs:
  pgvector:
    runs-on: ubuntu-latest
    steps:
      - name: Enable pgvector and apply IA schema
        uses: appleboy/ssh-action@master
        env:
          DB_USER: ${{ secrets.DATABASE_USER_PROD }}
          DB_NAME: ${{ secrets.DATABASE_NAME_PROD }}
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_USER,DB_NAME
          script: |
            set -e
            echo "== pgvector availability check =="
            if docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT count(*) FROM pg_available_extensions WHERE name='vector'" | grep -q '^1$'; then
              echo "pgvector binaries already present"
            else
              echo "installing postgresql-15-pgvector (apt)..."
              if ! docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod bash -lc 'apt-get update -qq && apt-get install -y -qq postgresql-15-pgvector'; then
                echo "apt install failed, building pgvector from source..."
                docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod bash -lc 'apt-get update -qq && apt-get install -y -qq git build-essential postgresql-server-dev-15 && git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git /tmp/pgvector && cd /tmp/pgvector && make -j"$(nproc)" && make install && rm -rf /tmp/pgvector'
              fi
              docker compose -f ~/municipall/prod/docker-compose.prod.yml restart postgres-prod
              sleep 10
            fi
            echo "== extension + embedding column + HNSW index =="
            printf '%s\n' \
              'CREATE EXTENSION IF NOT EXISTS vector;' \
              'ALTER TABLE reports ADD COLUMN IF NOT EXISTS embedding vector(384);' \
              'CREATE INDEX IF NOT EXISTS idx_reports_embedding_hnsw ON reports USING hnsw (embedding vector_cosine_ops);' \
              | docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME"
            echo "== relax legacy NOT NULL on location (chat reports have no GPS) =="
            docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod psql -U "$DB_USER" -d "$DB_NAME" -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='reports' AND column_name='location' AND is_nullable='NO') THEN ALTER TABLE reports ALTER COLUMN location DROP NOT NULL; END IF; END \$\$;"
            echo "== verification =="
            docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT extname FROM pg_extension WHERE extname='vector'"
            docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name='reports' AND column_name='embedding'"
            docker compose -f ~/municipall/prod/docker-compose.prod.yml exec -T postgres-prod psql -U "$DB_USER" -d "$DB_NAME" -tAc "SELECT indexname FROM pg_indexes WHERE tablename='reports' AND indexname='idx_reports_embedding_hnsw'"
