name: Deploy DEV

on:
  push:
    branches: [dev]

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Seed script dry-run
        run: npm run seed:demo -- --dry-run

  build-and-push:
    needs: validate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/municipall-backend:dev

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set lower case repository owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      - name: Copy docker-compose via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'docker-compose.dev.yml'
          target: '~/municipall/dev/'

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/municipall/dev
            cat > .env <<EOF
            NODE_ENV=development
            GITHUB_REPOSITORY_OWNER=${{ env.OWNER_LC }}
            DATABASE_USER_DEV=${{ secrets.DATABASE_USER_DEV }}
            DATABASE_PASSWORD_DEV=${{ secrets.DATABASE_PASSWORD_DEV }}
            DATABASE_NAME_DEV=${{ secrets.DATABASE_NAME_DEV }}
            JWT_SECRET_DEV=${{ secrets.JWT_SECRET_DEV }}
            OPENAI_API_KEY_DEV=${{ secrets.OPENAI_API_KEY_DEV }}
            OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}
            IDFM_API_KEY=${{ secrets.IDFM_API_KEY }}
            PLATFORM_ADMIN_KEY=${{ secrets.PLATFORM_ADMIN_KEY }}
            LITELLM_API_KEY=${{ secrets.LITELLM_API_KEY_PROD }}
            LITELLM_API_BASE=${{ secrets.LITELLM_API_BASE_PROD }}
            LITELLM_MODEL=${{ secrets.LITELLM_MODEL_PROD }}
            LITELLM_TIMEOUT_S=${{ secrets.LITELLM_TIMEOUT_S_PROD }}
            EOF
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d

            echo "Attente démarrage backend…"
            READY=0
            for i in $(seq 1 30); do
              CID=$(docker compose -f docker-compose.dev.yml ps -q backend-dev 2>/dev/null || true)
              if [ -n "$CID" ]; then
                STATUS=$(docker inspect -f '{{.State.Status}}' "$CID" 2>/dev/null || echo "unknown")
              else
                STATUS="missing"
              fi
              if [ "$STATUS" = "running" ]; then
                if docker compose -f docker-compose.dev.yml exec -T backend-dev node -e "process.exit(0)" 2>/dev/null; then
                  READY=1
                  break
                fi
              fi
              echo "  tentative $i/30 — état: $STATUS"
              sleep 5
            done

            if [ "$READY" != "1" ]; then
              echo "Backend indisponible — logs récents :"
              docker compose -f docker-compose.dev.yml logs --tail=80 backend-dev || true
              exit 1
            fi

            echo "Déploiement terminé. Seed de démo : via WebAdmin (Base de données) ou workflow seed-dev.yml."
