name: Ops — IA container deep diagnostics

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: IA env + direct chat call
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "===== IA container LITELLM env (secrets auto-masked) ====="
            docker exec prod-ia-prod-1 printenv | grep -E "^LITELLM"
            echo "===== direct IA chat call (capture error detail) ====="
            docker exec prod-ia-prod-1 python -c "
            import urllib.request, json
            req = urllib.request.Request(
                'http://localhost:8000/reporting/chat/citoyen',
                data=json.dumps({'user_id': '42', 'message': 'horaires de la mairie'}).encode(),
                headers={'Content-Type': 'application/json'},
            )
            try:
                r = urllib.request.urlopen(req, timeout=120)
                print('STATUS', r.status)
                print(r.read().decode()[:800])
            except urllib.error.HTTPError as e:
                print('STATUS', e.code)
                print(e.read().decode()[:800])
            "
